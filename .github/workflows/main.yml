name: Build Lingo Engine APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Source Code
      run: unzip "lingoengine (1).zip"
      
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Generate Keystore
      run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build APK
      run: gradle assembleDebug
      
    - uses: actions/upload-artifact@v4
      with:
        name: Yazen-Lingo-APK
        path: app/build/outputs/apk/debug/app-debug.apk
